<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Courses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/pages.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area"><i class="fas fa-user-graduate"></i></div>
            <ul class="nav-menu">
                <button class="nav-btn" onclick="location.href='{{ url_for("student_dashboard") }}'"><i class="fas fa-columns"></i> Dashboard</button>
                <button class="nav-btn active"><i class="fas fa-book"></i> My Courses</button>
                <button class="nav-btn" onclick="location.href='{{ url_for("student_assignments") }}'"><i class="fas fa-tasks"></i> Assignments</button>
                <button class="nav-btn" onclick="location.href='{{ url_for("student_grades") }}'"><i class="fas fa-chart-line"></i> Grades & Exams</button>
                <button class="nav-btn" onclick="location.href='{{ url_for("student_attendance") }}'"><i class="fas fa-check-circle"></i> Attendance</button>
                <button class="nav-btn" onclick="location.href='{{ url_for("student_timetable") }}'"><i class="fas fa-calendar-alt"></i> Timetable</button>
                <button class="nav-btn" onclick="location.href='{{ url_for("student_fees") }}'"><i class="fas fa-wallet"></i> Fees</button>
                <button class="nav-btn" onclick="location.href='{{ url_for("student_feedback") }}'"><i class="fas fa-comment-dots"></i> Feedback</button>
                <button class="nav-btn" onclick="location.href='{{ url_for("student_request") }}'"><i class="fas fa-envelope"></i> Requests</button>
            </ul>
            <a class="logout" href="{{ url_for('student_logout') }}">
                <i class="fas fa-sign-out-alt" style="margin-right: 15px;"></i> Logout
            </a>
        </aside>

        <main class="main-content">
            <header>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search courses...">
                </div>
                <div class="user-profile">
                    <div class="user-info">
                        <h4>{{ user_name }}</h4>
                        <span>{{ user_program }}</span>
                    </div>
                    <img src="https://i.pravatar.cc/150?img=12" class="avatar">
                </div>
            </header>

            <div class="banner">
                <div class="banner-text">
                    <h1>My Courses</h1>
                    <p>Access course materials and syllabus.</p>
                </div>
                <div class="banner-img"><i class="fas fa-book-reader"></i></div>
            </div>

            <div class="dashboard-grid">
                <div class="left-column" style="width:100%;">
                    <section>
                        <div class="section-title">Enrolled Courses</div>

                        <div class="courses-container">
                            {% for course in courses %}
                            <div class="course-card"
                                 {% if loop.index == 2 %}
                                 style="background: linear-gradient(135deg, #EEF0FF 0%, #D2CFFF 100%);"
                                 {% elif loop.index == 3 %}
                                 style="background: linear-gradient(135deg, #F5F7FF 0%, #E8E2FF 100%);"
                                 {% endif %}
                            >
                                <h4>{{ course.CourseName }}</h4>

                                <p style="font-size:13px; color:#666;">
                                    Faculty:
                                    {{ course.faculty_name if course.faculty_name else 'Not Assigned' }}
                                </p>

                                <button class="btn-view" onclick="location.href='{{ url_for("student_timetable") }}'">
                                    View Materials
                                </button>

                                <i class="fas fa-sitemap course-icon"></i>
                            </div>
                            {% endfor %}
                        </div>

                    </section>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
